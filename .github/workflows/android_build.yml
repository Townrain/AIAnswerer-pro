name: Android Build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create Release'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  checks: write
  pull-requests: write

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Run detekt
      continue-on-error: true
      run: ./gradlew detekt
    - name: Run Android lint
      continue-on-error: true
      run: ./gradlew lint
    - name: Upload lint reports
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: lint-reports
        path: |
          app/build/reports/lint-results-*.html
          app/build/reports/detekt/
        retention-days: 14

  test:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Run Unit Tests
      run: ./gradlew testDebugUnitTest
    - name: Upload Test Results
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: app/build/reports/tests/
        retention-days: 14
    - name: Publish Test Report
      if: success() || failure()
      uses: dorny/test-reporter@v1
      with:
        name: Unit Test Results
        path: app/build/test-results/**/TEST-*.xml
        reporter: java-junit
    - name: Generate Coverage Report
      continue-on-error: true
      run: ./gradlew koverXmlReportDebug
    - name: Upload Coverage Report
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: app/build/reports/kover/report.xml
        retention-days: 14

  build:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Setup signing
      env:
        KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "api.url=https://api.openai.com/v1/chat/completions" >> local.properties
        echo "api.model=gpt-4" >> local.properties
        mkdir -p keystore
        echo "$KEYSTORE_B64" | base64 -d > keystore/release.jks
        echo "signing.storeFile=../keystore/release.jks" >> local.properties
        echo "signing.storePassword=$KEYSTORE_PASS" >> local.properties
        echo "signing.keyAlias=$KEY_ALIAS" >> local.properties
        echo "signing.keyPassword=$KEY_PASS" >> local.properties
    - name: Build Debug APK
      run: ./gradlew assembleDebug
    - name: Build Release APK
      run: ./gradlew assembleRelease
    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 90

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release == 'true')
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: release-apk
    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: '*.apk'
        name: Release ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## AIAnswerer ${{ steps.get_version.outputs.VERSION }}

          ### 下载
          - APK: Release 版本

          ### 功能
          - 并行答题模式
          - 并发数可配置（1-10）
          - LLM/VLM/联网搜索测试
          - R8 代码混淆 + 资源压缩
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
