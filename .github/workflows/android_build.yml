name: Android Build

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create Release'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: ${{ github.ref != 'refs/heads/main' }}

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup signing
      env:
        KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "api.url=https://api.openai.com/v1/chat/completions" >> local.properties
        echo "api.model=gpt-4" >> local.properties
        mkdir -p keystore
        echo "$KEYSTORE_B64" | base64 -d > keystore/release.jks
        echo "signing.storeFile=../keystore/release.jks" >> local.properties
        echo "signing.storePassword=$KEYSTORE_PASS" >> local.properties
        echo "signing.keyAlias=$KEY_ALIAS" >> local.properties
        echo "signing.keyPassword=$KEY_PASS" >> local.properties

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Run Unit Tests
      run: ./gradlew test

    - name: Upload Test Results
      if: success() || failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: app/build/reports/tests/
        retention-days: 14

    - name: Generate Coverage Report (Kover)
      continue-on-error: true
      run: ./gradlew koverXmlReportDebug

    - name: Upload Debug APK
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Release APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30

    - name: Upload Test Coverage Report
      continue-on-error: true
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: app/build/reports/kover/report.xml
        retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release == 'true')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: true

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup signing
      env:
        KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
        KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASS: ${{ secrets.KEY_PASSWORD }}
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "api.url=https://api.openai.com/v1/chat/completions" >> local.properties
        echo "api.model=gpt-4" >> local.properties
        mkdir -p keystore
        echo "$KEYSTORE_B64" | base64 -d > keystore/release.jks
        echo "signing.storeFile=../keystore/release.jks" >> local.properties
        echo "signing.storePassword=$KEYSTORE_PASS" >> local.properties
        echo "signing.keyAlias=$KEY_ALIAS" >> local.properties
        echo "signing.keyPassword=$KEY_PASS" >> local.properties

    - name: Build Release APK
      run: ./gradlew assembleRelease

    - name: Get version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          app/build/outputs/apk/release/*.apk
        name: Release ${{ steps.get_version.outputs.VERSION }}
        body: |
          ## AIAnswerer ${{ steps.get_version.outputs.VERSION }}

          ### 下载
          - APK: Release 版本

          ### 功能
          - 并行答题模式
          - 并发数可配置（1-10）
          - LLM/VLM/联网搜索测试
          - R8 代码混淆 + 资源压缩
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
